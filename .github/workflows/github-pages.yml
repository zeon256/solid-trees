name: Deploy Playground and Docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build playground and docs
        run: pnpm --filter playground --filter docs build
      # The playground owns `/`. The docs own `/docs` plus their root files
      # (`/api/search`, `/llms.txt`, `/llms-full.txt`, `/404.html`); their `/`
      # redirect is only for running the docs on their own.
      - name: Assemble site
        run: |
          mkdir site
          cp -R apps/playground/dist/. site/
          rsync -a --ignore-existing --exclude=/index.html apps/docs/dist/ site/
      - name: Deploy to GitHub Pages
        uses: jamesives/github-pages-deploy-action@36ee275936a1c16fb4dedae090a06396849f07c0 # v4.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site
