name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    if:
      "!contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'docs:')"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Build library
        run: pnpm --filter solid-trees build
      - name: Assemble release package
        run:
          node packages/solid-trees/scripts/prepare-package.mjs release-package
      # `npm publish --dry-run` rejects versions already on the registry, and
      # the real version is only set by semantic-release in the release job.
      - name: Pack npm tarball (dry run)
        working-directory: release-package
        run: npm pack --dry-run
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifact
          path: release-package
          include-hidden-files: true

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Download artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifact
          path: release-package
      - name: Setup Node.js for npm OIDC
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Installed outside release-package so its node_modules stays out of the
      # published directory.
      - name: Install semantic-release
        run:
          npm install --prefix "$RUNNER_TEMP/semantic-release" --no-save
          semantic-release@25.0.3
      - name: Release
        working-directory: release-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$RUNNER_TEMP/semantic-release/node_modules/.bin/semantic-release"'
